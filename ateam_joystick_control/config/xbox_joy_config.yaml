/joystick_control_node:
  ros__parameters:
    max_accel_linear: 2.0  # m/s^2
    max_accel_angular: 20.0  # rad/s^2
    pivot:  # hold the pivot button; tunable live (rqt_reconfigure)
      angular_range: 1.6  # rad heading offset at full left stick, from the heading at press
      inset_angle: 1.6  # rad, orbit tangent -> heading toward the ball (pi/2 = face the ball)
      compute_inset_angle: false
      backward: false
      orbit_radius: 0.15  # m, robot center to pivot point
      max_angular_vel: 10.0  # rad/s, 0 = firmware default
      max_angular_acc: 15.0  # rad/s^2, 0 = firmware default
    face_goal:  # hold the face-goal trigger: local velocity, heading servoed onto the goal we score on (+x in our frame)
      kp: 4.0  # 1/s, heading error -> angular velocity
      max_angular_vel: 6.0  # rad/s
    capture:  # press the capture button (X) to toggle: face the closest ball and drive into it
      velocity: 0.2  # m/s forward
      max_accel_linear: 0.5  # m/s^2
      kp: 4.0  # 1/s, heading error -> angular velocity
      max_angular_vel: 6.0  # rad/s
    mapping:
      linear:
        x:
          axis: 1
          scale: 0.2
        y:
          axis: 0
          scale: 0.2
      angular:
        z:
          axis: 3
          scale: 3.0
      kick: "axis 5 < -0.8"
      pivot: "button 5"
      pivot_axis: 0  # left stick horizontal steers the pivot heading
      face_goal: "axis 2 < -0.5"  # left trigger: face the goal we score on
      capture: "button 2"  # X: toggle capture
      dribbler:
        increment: "button 3"
        decrement: "button 1"
        spin: "button 4"
