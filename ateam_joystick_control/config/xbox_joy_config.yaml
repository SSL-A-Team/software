/joystick_control_node:
  ros__parameters:
    max_accel_linear: 2.0  # m/s^2
    max_accel_angular: 20.0  # rad/s^2
    kick_speed: 2.0  # m/s, kick button and pivot shot
    pivot:  # hold the pivot button; tunable live (rqt_reconfigure)
      angular_range: 1.6  # rad heading offset at full left stick, from the heading at press
      inset_angle: 1.6  # rad, orbit tangent -> heading toward the ball (pi/2 = face the ball)
      compute_inset_angle: false
      backward: false
      orbit_radius: 0.15  # m, robot center to pivot point
      max_angular_vel: 10.0  # rad/s, 0 = firmware default
      max_angular_acc: 15.0  # rad/s^2, 0 = firmware default
    face_goal:  # hold the face-goal trigger: local velocity, heading servoed onto the goal we score on (+x in our frame)
      kp: 4.0  # 1/s, heading error -> angular velocity
      max_angular_vel: 6.0  # rad/s
    capture:  # press X to toggle: dribbler on, face the closest ball and drive into it
      velocity: 0.2  # m/s forward
      max_accel_linear: 1.0  # m/s^2
      breakbeam_filter_tau_ms: 100.0  # ms, breakbeam low-pass time constant
      breakbeam_threshold: 0.8  # filtered level that ends capture (~160 ms continuous at defaults)
      kp: 4.0  # 1/s, heading error -> angular velocity
      max_angular_vel: 6.0  # rad/s
    pivot_shot:  # press A: dribbler off, pivot (pivot.* params) to face the goal, then line kick through the ball
      heading_tolerance: 0.05  # rad, heading error to the goal that ends the pivot
      angular_vel_tolerance: 0.3  # rad/s
      pivot_timeout: 4.0  # s
      line_velocity: 0.5  # m/s along the line through the ball
      line_max_accel: 2.0  # m/s^2, 0 = firmware default
      line_distance: 0.2  # m of travel that ends the line
      line_timeout: 1.5  # s
    mapping:
      linear:
        x:
          axis: 1
          scale: 0.2
        y:
          axis: 0
          scale: 0.2
      angular:
        z:
          axis: 3
          scale: 3.0
      kick: "axis 5 < -0.8"
      pivot: "button 5"
      pivot_axis: 0  # left stick horizontal steers the pivot heading
      face_goal: "axis 2 < -0.5"  # left trigger: face the goal we score on
      capture: "button 2"  # X: toggle capture (spins the dribbler)
      pivot_shot: "button 0"  # A: pivot shot
      dribbler:
        speed: 0.045  # setpoint, fraction of full effort (Y/B step it live)
        increment: "button 3"
        decrement: "button 1"
        spin: "button 4"
