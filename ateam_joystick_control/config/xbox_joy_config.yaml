/joystick_control_node:
  ros__parameters:
    max_accel_linear: 2.0  # m/s^2
    max_accel_angular: 10.0  # rad/s^2
    pivot:  # hold the pivot button; tunable live (rqt_reconfigure)
      angular_range: 3.14159  # rad of target heading per full stick, from the heading at press
      inset_angle: 0.8  # rad, orbit tangent -> heading toward the ball (pi/2 = face the ball)
      compute_inset_angle: false
      backward: false
      orbit_radius: 0.15  # m, robot center to pivot point
      max_angular_vel: 0.0  # rad/s, 0 = firmware default
      max_angular_acc: 0.0  # rad/s^2, 0 = firmware default
    mapping:
      linear:
        x:
          axis: 1
          scale: 2.0
        y:
          axis: 0
          scale: 2.0
      angular:
        z:
          axis: 3
          scale: 4.0
      kick: "axis 5 < -0.8"
      pivot: "button 5"
      dribbler:
        increment: "button 3"
        decrement: "button 2"
        spin: "button 4"
